
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Academic Advisor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Smart Academic Advisor</h1>

        <p class="description">
            Welcome! Enter your academic information to receive
            a prediction of your academic performance.
        </p>

        <form action="/predict" method="POST">

            <label for="cgpa">Current CGPA (0 - 5)</label>
            <input
                type="number"
                id="cgpa"
                name="cgpa"
                min="0"
                max="5"
                step="0.01"
                required
                placeholder="e.g. 3.50"
            >

            <label for="attendance">Attendance (%)</label>
            <input
                type="number"
                id="attendance"
                name="attendance"
                min="0"
                max="100"
                required
                placeholder="e.g. 85"
            >

            <label for="study_hours">Study Hours Per Day</label>
            <input
                type="number"
                id="study_hours"
                name="study_hours"
                min="0"
                max="24"
                step="0.5"
                required
                placeholder="e.g. 3"
            >

            <label for="difficult_courses">
                Number of Difficult Courses
            </label>
            <input
                type="number"
                id="difficult_courses"
                name="difficult_courses"
                min="0"
                required
                placeholder="e.g. 2"
            >

            <button type="submit">Predict My Academic Performance</button>
        </form>

        <p class="footer">
            CSC 303 Project | Smart Academic Advisor
        </p>
    </div>
</body>
</html>
