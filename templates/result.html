
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Prediction Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1d4ed8;
        }

        .prediction {
            font-size: 25px;
            font-weight: bold;
            margin: 25px 0;
            color: #15803d;
        }

        .details {
            text-align: left;
            line-height: 2;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Academic Prediction Result</h1>

        <p>Your AI model's prediction is:</p>

        <div class="prediction">{{ prediction }}</div>

        <p>Model confidence: {{ confidence }}%</p>

        <div class="details">
            <strong>Your submitted information</strong><br>
            CGPA: {{ cgpa }}<br>
            Attendance: {{ attendance }}%<br>
            Study hours per day: {{ study_hours }}<br>
            Difficult courses: {{ difficult_courses }}
        </div>

        <a href="/">Try Again</a>
    </div>
</body>
</html>
